<!DOCTYPE html>
<html>

<head>
    <title>{{ .order.Title }}</title>
    <link rel="stylesheet" href="/static/styles/index.css">
    <link rel="stylesheet" href="/static/styles/card.css">
    <link rel="stylesheet" href="/static/styles/order.css">
    <meta charset="utf-8">
</head>

<body>
    <header>
        <div class="layout">
            <a href="/" class="header-link">CAVI калькулятор</a>
        </div>
    </header>

    <main>
        <div class="layout">
            <div class="order-page">
                <div class="card large">
                    <div class="content">
                        <img src="/static/img/1.jpg" alt="{{ .order.Title }}">
                        <div class="details">
                            <div class="title">{{ .order.Title }}</div>
                            <div class="text">{{ .order.Text }}</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>

</html>
