services:
  postgres:
    image: postgres:15
    container_name: cavi_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cavi_db}
      POSTGRES_USER: ${POSTGRES_USER:-cavi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cavi_password}
    ports:
      - "5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - cavi_network

  adminer:
    image: adminer:4.8.1
    container_name: cavi_adminer
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - cavi_network

  minio:
    image: minio/minio:latest
    container_name: cavi_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cavi_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cavi_password123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - cavi_network

  redis:
    image: redis:7-alpine
    container_name: cavi_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cavi_network
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  minio_data:
  redis_data:

networks:
  cavi_network:
    driver: bridge