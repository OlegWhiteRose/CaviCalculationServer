basePath: /api
definitions:
  handler.AddToDraftResponse:
    description: ID заявки-черновика
    properties:
      calculation_id:
        example: 1
        type: integer
    type: object
  handler.CalculationGroupResponse:
    description: Информация о группе в составе заявки
    properties:
      cavi_index:
        example: 7.5
        type: number
      group:
        $ref: '#/definitions/handler.GroupResponse'
      group_id:
        example: 1
        type: integer
    type: object
  handler.CalculationResponse:
    description: Полная информация о заявке на расчёт CAVI
    properties:
      calculation_groups:
        items:
          $ref: '#/definitions/handler.CalculationGroupResponse'
        type: array
      creator_login:
        example: user1
        type: string
      date_completed:
        example: "2025-01-15T12:00:00Z"
        type: string
      date_created:
        example: "2025-01-15T10:30:00Z"
        type: string
      date_formed:
        example: "2025-01-15T11:00:00Z"
        type: string
      diastolic_pressure:
        example: 80
        type: integer
      groups_count:
        example: 3
        type: integer
      id:
        example: 1
        type: integer
      moderator_login:
        example: moderator1
        type: string
      pulse_wave_velocity:
        example: 8.5
        type: number
      status:
        example: draft
        type: string
      systolic_pressure:
        example: 120
        type: integer
    type: object
  handler.CalculationUpdateRequest:
    description: Данные для обновления полей заявки (давление, скорость пульсовой
      волны)
    properties:
      diastolic_pressure:
        example: 80
        type: integer
      pulse_wave_velocity:
        example: 8.5
        type: number
      systolic_pressure:
        example: 120
        type: integer
    type: object
  handler.CartIconResponse:
    description: Информация о черновике заявки пользователя
    properties:
      calculation_id:
        example: 1
        type: integer
      items:
        example: 3
        type: integer
    type: object
  handler.DraftGroupDeleteRequest:
    description: ID группы для удаления из черновика заявки
    properties:
      group_id:
        example: 1
        type: integer
    required:
    - group_id
    type: object
  handler.DraftGroupResponse:
    description: ID заявки-черновика после операции
    properties:
      calculation_id:
        example: 1
        type: integer
    type: object
  handler.DraftGroupUpdateRequest:
    description: Данные для обновления группы в черновике (индекс CAVI)
    properties:
      cavi_index:
        example: 7.5
        type: number
      group_id:
        example: 1
        type: integer
    required:
    - group_id
    type: object
  handler.ErrorResponse:
    description: Стандартный ответ с ошибкой
    properties:
      message:
        example: invalid input
        type: string
      status:
        example: fail
        type: string
    type: object
  handler.GroupCreateRequest:
    description: Данные для создания новой группы пациентов
    properties:
      age_group:
        enum:
        - young
        - middle
        - elderly
        example: young
        type: string
      description:
        example: Эластичные сосуды с низким уровнем жесткости
        type: string
      disease_type:
        enum:
        - diabetes
        - hypertension
        example: diabetes
        type: string
      name:
        example: Молодые пациенты
        type: string
    required:
    - age_group
    - name
    type: object
  handler.GroupResponse:
    description: Информация о группе пациентов
    properties:
      age_group:
        example: young
        type: string
      description:
        example: Эластичные сосуды с низким уровнем жесткости
        type: string
      disease_type:
        example: diabetes
        type: string
      id:
        example: 1
        type: integer
      image_url:
        example: http://localhost:9000/cavi-images/diagrams/1.jpg
        type: string
      is_deleted:
        example: false
        type: boolean
      is_selected:
        example: false
        type: boolean
      name:
        example: Молодые пациенты (до 35 лет)
        type: string
    type: object
  handler.GroupUpdateRequest:
    description: Данные для обновления группы пациентов
    properties:
      age_group:
        enum:
        - young
        - middle
        - elderly
        example: middle
        type: string
      description:
        example: Обновлённое описание
        type: string
      disease_type:
        enum:
        - diabetes
        - hypertension
        example: hypertension
        type: string
      is_selected:
        example: true
        type: boolean
      name:
        example: Обновлённое название
        type: string
    type: object
  handler.ImageUploadResponse:
    description: URL загруженного изображения
    properties:
      image_url:
        example: http://localhost:9000/cavi-images/diagrams/1.jpg
        type: string
    type: object
  handler.LoginResponse:
    description: Токены и информация о пользователе после входа
    properties:
      is_moderator:
        example: false
        type: boolean
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      username:
        example: user1
        type: string
    type: object
  handler.ModerateRequest:
    description: Действие модератора над заявкой
    properties:
      action:
        enum:
        - complete
        - reject
        example: complete
        type: string
    required:
    - action
    type: object
  handler.RefreshRequest:
    description: Refresh токен для получения новой пары токенов
    properties:
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    required:
    - refresh_token
    type: object
  handler.SuccessResponse:
    description: Стандартный успешный ответ
    properties:
      status:
        example: ok
        type: string
    type: object
  handler.UserLoginRequest:
    description: Данные для входа в систему
    properties:
      password:
        example: password
        type: string
      username:
        example: user1
        type: string
    required:
    - password
    - username
    type: object
  handler.UserRegisterRequest:
    description: Данные для регистрации нового пользователя
    properties:
      password:
        example: password123
        type: string
      username:
        example: newuser
        type: string
    required:
    - password
    - username
    type: object
  handler.UserResponse:
    description: Информация о пользователе
    properties:
      is_moderator:
        example: false
        type: boolean
      username:
        example: user1
        type: string
    type: object
  handler.UserUpdateRequest:
    description: Данные для обновления профиля пользователя
    properties:
      password:
        example: newpassword123
        type: string
      username:
        example: newusername
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@cavi.local
    name: API Support
  description: |-
    API для расчёта индекса CAVI (Cardio-Ankle Vascular Index).
    Система позволяет управлять группами пациентов, создавать заявки на расчёт,
    добавлять группы в заявки и проводить модерацию.
  title: CAVI Calculator API
  version: "1.0"
paths:
  /cavi-calculations:
    get:
      description: Возвращает список заявок (кроме удалённых и черновиков) с фильтрацией
        по статусу и диапазону дат формирования.
      parameters:
      - description: Фильтр по статусу
        enum:
        - formed
        - completed
        - rejected
        in: query
        name: status
        type: string
      - description: Дата формирования от (YYYY-MM-DD)
        example: '"2025-01-01"'
        in: query
        name: date_from
        type: string
      - description: Дата формирования до (YYYY-MM-DD)
        example: '"2025-12-31"'
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Список заявок
          schema:
            items:
              $ref: '#/definitions/handler.CalculationResponse'
            type: array
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Список заявок
      tags:
      - calculations
  /cavi-calculations/{id}:
    delete:
      description: Мягкое удаление заявки-черновика. Доступно только создателю заявки.
        Удаляет связи с группами.
      parameters:
      - description: ID заявки
        example: 1
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Заявка удалена
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Неверный ID или заявка не является черновиком
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Заявка не найдена
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удалить заявку
      tags:
      - calculations
    get:
      description: Возвращает детальную информацию о заявке, включая все группы в
        её составе.
      parameters:
      - description: ID заявки
        example: 1
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Информация о заявке
          schema:
            $ref: '#/definitions/handler.CalculationResponse'
        "400":
          description: Неверный ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Заявка не найдена
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить заявку
      tags:
      - calculations
    put:
      consumes:
      - application/json
      description: 'Обновляет поля заявки: систолическое/диастолическое давление,
        скорость пульсовой волны.'
      parameters:
      - description: ID заявки
        example: 1
        in: path
        name: id
        required: true
        type: integer
      - description: Данные для обновления
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.CalculationUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Заявка обновлена
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновить заявку
      tags:
      - calculations
  /cavi-calculations/{id}/moderate:
    put:
      consumes:
      - application/json
      description: Завершает или отклоняет сформированную заявку. Доступно только
        модераторам. При завершении устанавливается количество групп.
      parameters:
      - description: ID заявки
        example: 1
        in: path
        name: id
        required: true
        type: integer
      - description: Действие модератора
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ModerateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Заявка обработана
          schema:
            $ref: '#/definitions/handler.CalculationResponse'
        "400":
          description: Неверные данные или статус заявки
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Требуется роль модератора
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Заявка не найдена
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Модерировать заявку
      tags:
      - calculations
  /cavi-calculations/draft:
    get:
      description: Возвращает ID черновика заявки текущего пользователя и количество
        групп в нём.
      produces:
      - application/json
      responses:
        "200":
          description: Информация о корзине
          schema:
            $ref: '#/definitions/handler.CartIconResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Корзина (черновик)
      tags:
      - calculations
  /cavi-calculations/draft/form:
    put:
      description: Переводит черновик в статус "сформирована". Проверяет наличие групп
        в заявке. Устанавливает дату формирования.
      produces:
      - application/json
      responses:
        "200":
          description: Заявка сформирована
          schema:
            $ref: '#/definitions/handler.CalculationResponse'
        "400":
          description: Нет групп в заявке
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Черновик не найден
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Сформировать заявку
      tags:
      - calculations
  /cavi-calculations/draft/groups:
    delete:
      consumes:
      - application/json
      description: Удаляет группу из заявки-черновика текущего пользователя.
      parameters:
      - description: ID группы
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.DraftGroupDeleteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Группа удалена
          schema:
            $ref: '#/definitions/handler.DraftGroupResponse'
        "400":
          description: Неверный ID или группа не найдена в черновике
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удалить группу из черновика
      tags:
      - calculation-groups
    put:
      consumes:
      - application/json
      description: Обновляет индекс CAVI для группы в заявке-черновике текущего пользователя.
      parameters:
      - description: Данные для обновления
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.DraftGroupUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Группа обновлена
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Неверные данные или черновик не найден
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновить группу в черновике
      tags:
      - calculation-groups
  /cavi-groups:
    get:
      description: Возвращает список всех групп пациентов с возможностью фильтрации
        по названию, возрастной группе и типу заболевания.
      parameters:
      - description: Поиск по названию (частичное совпадение)
        in: query
        name: title
        type: string
      - description: Фильтр по возрастной группе
        enum:
        - young
        - middle
        - elderly
        in: query
        name: age_group
        type: string
      - description: Фильтр по типу заболевания
        enum:
        - diabetes
        - hypertension
        in: query
        name: disease_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Список групп
          schema:
            items:
              $ref: '#/definitions/handler.GroupResponse'
            type: array
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Список групп
      tags:
      - groups
    post:
      consumes:
      - application/json
      description: Создаёт новую группу пациентов. Доступно только модераторам.
      parameters:
      - description: Данные новой группы
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.GroupCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Группа создана
          schema:
            $ref: '#/definitions/handler.GroupResponse'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Требуется роль модератора
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создать группу
      tags:
      - groups
  /cavi-groups/{id}:
    delete:
      description: Мягкое удаление группы (is_deleted = true). Также удаляет изображение.
        Доступно только модераторам.
      parameters:
      - description: ID группы
        example: 1
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Группа удалена
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Неверный ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Требуется роль модератора
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удалить группу
      tags:
      - groups
    get:
      description: Возвращает детальную информацию о группе пациентов по её ID.
      parameters:
      - description: ID группы
        example: 1
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Информация о группе
          schema:
            $ref: '#/definitions/handler.GroupResponse'
        "400":
          description: Неверный ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Группа не найдена
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Получить группу
      tags:
      - groups
    put:
      consumes:
      - application/json
      description: Обновляет данные группы пациентов. Доступно только модераторам.
      parameters:
      - description: ID группы
        example: 1
        in: path
        name: id
        required: true
        type: integer
      - description: Данные для обновления
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.GroupUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Группа обновлена
          schema:
            $ref: '#/definitions/handler.GroupResponse'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Требуется роль модератора
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновить группу
      tags:
      - groups
  /cavi-groups/{id}/add-to-draft:
    post:
      description: Добавляет группу в заявку-черновик текущего пользователя. Если
        черновика нет — создаёт новый.
      parameters:
      - description: ID группы
        example: 1
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "201":
          description: Группа добавлена в черновик
          schema:
            $ref: '#/definitions/handler.AddToDraftResponse'
        "400":
          description: Неверный ID или группа уже в черновике
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Добавить в черновик
      tags:
      - groups
  /cavi-groups/{id}/image:
    post:
      consumes:
      - multipart/form-data
      description: Загружает или заменяет изображение группы. Доступно только модераторам.
      parameters:
      - description: ID группы
        example: 1
        in: path
        name: id
        required: true
        type: integer
      - description: Файл изображения (JPEG, PNG)
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Изображение загружено
          schema:
            $ref: '#/definitions/handler.ImageUploadResponse'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Требуется роль модератора
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Загрузить изображение
      tags:
      - groups
  /users/login:
    post:
      consumes:
      - application/json
      description: Аутентифицирует пользователя и возвращает JWT токены (access +
        refresh).
      parameters:
      - description: Данные для входа
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UserLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешный вход
          schema:
            $ref: '#/definitions/handler.LoginResponse'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Неверные учётные данные
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Вход
      tags:
      - users
  /users/logout:
    post:
      description: Добавляет access токен в blacklist Redis и удаляет refresh токен.
      produces:
      - application/json
      responses:
        "200":
          description: Успешный выход
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Выход
      tags:
      - users
  /users/me:
    get:
      description: Возвращает информацию о текущем авторизованном пользователе.
      produces:
      - application/json
      responses:
        "200":
          description: Данные пользователя
          schema:
            $ref: '#/definitions/handler.UserResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Текущий пользователь
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Обновляет username и/или пароль текущего пользователя.
      parameters:
      - description: Данные для обновления
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UserUpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Профиль обновлён
          schema:
            $ref: '#/definitions/handler.UserResponse'
        "400":
          description: Неверные данные или username занят
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновить профиль
      tags:
      - users
  /users/refresh:
    post:
      consumes:
      - application/json
      description: Обновляет access и refresh токены по валидному refresh токену.
      parameters:
      - description: Refresh токен
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Новые токены
          schema:
            $ref: '#/definitions/handler.LoginResponse'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Невалидный или истёкший refresh токен
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Обновить токены
      tags:
      - users
  /users/register:
    post:
      consumes:
      - application/json
      description: Создаёт нового пользователя в системе. Пароль хешируется с помощью
        bcrypt.
      parameters:
      - description: Данные для регистрации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UserRegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Пользователь создан
          schema:
            $ref: '#/definitions/handler.UserResponse'
        "400":
          description: Неверные данные или пользователь существует
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Регистрация
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: 'JWT токен в формате: Bearer {token}'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
