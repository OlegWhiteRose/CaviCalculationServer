<!DOCTYPE html>
<html>

<head>
    <title>Расчёт CAVI</title>
    <link rel="stylesheet" href="/static/styles/index.css">
    <link rel="stylesheet" href="/static/styles/calculation.css">
</head>

<body>
    <header>
        <div class="layout">
            <a href="/" class="header-link">CAVI калькулятор</a>
        </div>
    </header>

    <main>
        <div class="layout">
            <h1>Расчёт CAVI</h1>

            <div class="form-container">
                <div class="form-section">
                    <h2>Данные измерений</h2>
                    <div class="measurement-form">
                        <div class="form-group">
                            <label>Время распространения пульсовой волны (м/с)</label>
                            <input type="number" step="0.1" placeholder="Введите значение" />
                        </div>
                        <div class="form-group">
                            <label>Систолическое артериальное давление (мм рт. ст.)</label>
                            <input type="number" placeholder="Введите значение" />
                        </div>
                        <div class="form-group">
                            <label>Диастолическое артериальное давление (мм рт. ст.)</label>
                            <input type="number" placeholder="Введите значение" />
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2>Выбранные услуги</h2>
                    <div class="services-list">
                        {{ range .calculation.Services }}
                        <div class="service-item">
                            <img src="{{ .ImageURL }}" alt="{{ .Title }}" class="service-image">
                            <div class="control-group">
                                <h3>{{ .Title }}</h3>
                                <p class="service-subtitle">{{ .Subtitle }}</p>
                            </div>
                            <div class="control-group CAVI-price-group">
                                <div class="CAVI-price-group-content">
                                    <span class="price-value">{{ .Price }}</span>
                                    <span class="price-label">{{ .PriceLabel }}</span>
                                </div>
                            </div>
                        </div>
                        {{ end }}
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
