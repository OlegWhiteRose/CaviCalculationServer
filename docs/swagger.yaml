basePath: /
definitions:
  ds.CaviCalculation:
    properties:
      calculationGroups:
        items:
          $ref: '#/definitions/ds.CaviCalculationGroup'
        type: array
      completedAt:
        type: string
      createdAt:
        type: string
      creator:
        $ref: '#/definitions/ds.User'
      creatorLogin:
        type: string
      creatorUsername:
        type: string
      diastolicPressure:
        type: integer
      formedAt:
        type: string
      id:
        type: integer
      moderator:
        $ref: '#/definitions/ds.User'
      moderatorLogin:
        type: string
      moderatorUsername:
        type: string
      pulseWaveVelocity:
        format: float64
        type: number
      resultCount:
        type: integer
      status:
        type: string
      systolicPressure:
        type: integer
    type: object
  ds.CaviCalculationGroup:
    properties:
      calculatedCAVI:
        type: number
      calculationID:
        type: integer
      caviindex:
        type: number
      group:
        $ref: '#/definitions/ds.CaviGroup'
      groupID:
        type: integer
      id:
        type: integer
    type: object
  ds.CaviGroup:
    properties:
      ageGroup:
        type: string
      basePrice:
        type: number
      description:
        type: string
      diseaseType:
        type: string
      id:
        type: integer
      imageURL:
        type: string
      isDeleted:
        type: boolean
      isSelected:
        type: boolean
      name:
        type: string
    type: object
  ds.User:
    properties:
      id:
        type: integer
      isModerator:
        type: boolean
      password:
        type: string
      username:
        type: string
    type: object
  handler.AddToDraftResponse:
    properties:
      calculation_id:
        example: 1
        type: integer
    type: object
  handler.CalculationDetailResponse:
    properties:
      data:
        $ref: '#/definitions/ds.CaviCalculation'
    type: object
  handler.CalculationsListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/ds.CaviCalculation'
        type: array
    type: object
  handler.CartIconResponse:
    properties:
      calculation_id:
        example: 1
        type: integer
      items:
        example: 3
        type: integer
    type: object
  handler.ErrorResponse:
    properties:
      message:
        example: неверные учетные данные
        type: string
    type: object
  handler.ImageUploadResponse:
    properties:
      image_url:
        example: http://localhost:8000/storage/groups/1.jpg
        type: string
    type: object
  handler.LoginRequest:
    description: Данные для входа в систему
    properties:
      password:
        example: password
        type: string
      username:
        example: user1
        type: string
    required:
    - password
    - username
    type: object
  handler.LoginResponse:
    properties:
      message:
        example: аутентификация успешна
        type: string
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user:
        properties:
          is_moderator:
            example: false
            type: boolean
          username:
            example: user1
            type: string
        type: object
    type: object
  handler.RegisterRequest:
    description: Данные для регистрации нового пользователя
    properties:
      password:
        example: password123
        type: string
      username:
        example: newuser
        type: string
    required:
    - password
    - username
    type: object
  handler.RegisterResponse:
    properties:
      message:
        example: пользователь успешно зарегистрирован
        type: string
      user:
        properties:
          is_moderator:
            example: false
            type: boolean
          username:
            example: newuser
            type: string
        type: object
    type: object
  handler.SuccessResponse:
    properties:
      message:
        example: операция выполнена успешно
        type: string
    type: object
  handler.UpdateProfileRequest:
    properties:
      password:
        example: newpassword123
        type: string
      username:
        example: newusername
        type: string
    type: object
  handler.UpdateProfileResponse:
    properties:
      message:
        example: профиль успешно обновлен
        type: string
      user:
        properties:
          is_moderator:
            example: false
            type: boolean
          username:
            example: newusername
            type: string
        type: object
    type: object
  handler.UserInfoResponse:
    properties:
      message:
        example: данные пользователя
        type: string
      user:
        properties:
          is_moderator:
            example: false
            type: boolean
          username:
            example: user1
            type: string
        type: object
    type: object
  handler.calcUpdateReq:
    properties:
      diastolic_pressure:
        type: integer
      pulse_wave_velocity:
        type: number
      systolic_pressure:
        type: integer
    type: object
  handler.groupCreateReq:
    properties:
      age_group:
        type: string
      description:
        type: string
      disease_type:
        type: string
      name:
        type: string
    type: object
  handler.groupUpdateReq:
    properties:
      age_group:
        type: string
      description:
        type: string
      disease_type:
        type: string
      is_selected:
        type: boolean
      name:
        type: string
    type: object
  handler.mmDeleteReq:
    properties:
      group_id:
        type: integer
    type: object
  handler.mmUpdateReq:
    properties:
      cavi_index:
        type: number
      group_id:
        type: integer
    type: object
  handler.moderateReq:
    properties:
      action:
        type: string
    type: object
host: localhost:8000
info:
  contact:
    email: support@cavi.com
    name: API Support
  description: API для управления заявками и группами CAVI с поддержкой аутентификации
    и авторизации
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: CAVI Calculator API
  version: "1.0"
paths:
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Аутентифицирует пользователя и возвращает JWT токен
      parameters:
      - description: Данные для входа
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешный вход
          schema:
            $ref: '#/definitions/handler.LoginResponse'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Неверные учетные данные
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Вход в систему
      tags:
      - auth
  /api/auth/logout:
    post:
      description: Удаляет сессию пользователя из Redis
      produces:
      - application/json
      responses:
        "200":
          description: Успешный выход
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Ошибка при удалении сессии
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Выход из системы
      tags:
      - auth
  /api/auth/me:
    get:
      description: Возвращает информацию о текущем авторизованном пользователе
      produces:
      - application/json
      responses:
        "200":
          description: Информация о пользователе
          schema:
            $ref: '#/definitions/handler.UserInfoResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить текущего пользователя
      tags:
      - auth
    put:
      consumes:
      - application/json
      description: Обновляет username и/или пароль текущего пользователя
      parameters:
      - description: Данные для обновления
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Профиль успешно обновлен
          schema:
            $ref: '#/definitions/handler.UpdateProfileResponse'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Имя пользователя уже занято
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновить профиль
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: Создает нового пользователя в системе
      parameters:
      - description: Данные для регистрации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Успешная регистрация
          schema:
            $ref: '#/definitions/handler.RegisterResponse'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "409":
          description: Пользователь уже существует
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Регистрация нового пользователя
      tags:
      - auth
  /api/cavi-calculations:
    get:
      description: Возвращает список заявок. Обычные пользователи видят только свои
        заявки, модераторы - все
      parameters:
      - description: Фильтр по статусу
        in: query
        name: status
        type: string
      - description: Дата от (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: Дата до (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Список заявок
          schema:
            $ref: '#/definitions/handler.CalculationsListResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить список заявок
      tags:
      - calculations
  /api/cavi-calculations/{id}:
    delete:
      description: Удаляет заявку-черновик (доступно только создателю)
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Заявка удалена
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Заявка не найдена
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удалить заявку
      tags:
      - calculations
    get:
      description: Возвращает детальную информацию о заявке. Обычные пользователи
        могут видеть только свои заявки
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Информация о заявке
          schema:
            $ref: '#/definitions/handler.CalculationDetailResponse'
        "400":
          description: Неверный ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Доступ запрещен
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Заявка не найдена
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить заявку по ID
      tags:
      - calculations
    put:
      consumes:
      - application/json
      description: Обновляет поля заявки (систолическое давление, диастолическое давление,
        скорость пульсовой волны)
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: integer
      - description: Данные для обновления
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.calcUpdateReq'
      produces:
      - application/json
      responses:
        "200":
          description: Обновленная заявка
          schema:
            $ref: '#/definitions/ds.CaviCalculation'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновить заявку
      tags:
      - calculations
  /api/cavi-calculations/{id}/form:
    put:
      description: Изменяет статус заявки с draft на formed (только для модераторов)
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Заявка сформирована
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Требуется роль модератора
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Заявка не найдена
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Сформировать заявку
      tags:
      - calculations
  /api/cavi-calculations/{id}/moderate:
    put:
      consumes:
      - application/json
      description: Изменяет статус заявки с formed на completed или rejected (только
        для модераторов)
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: integer
      - description: Действие (complete или reject)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.moderateReq'
      produces:
      - application/json
      responses:
        "200":
          description: Заявка обработана
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Требуется роль модератора
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Заявка не найдена
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Завершить/отклонить заявку
      tags:
      - calculations
  /api/cavi-calculations/draft:
    get:
      description: Возвращает ID черновика и количество групп в нем
      produces:
      - application/json
      responses:
        "200":
          description: Данные корзины
          schema:
            $ref: '#/definitions/handler.CartIconResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить иконку корзины
      tags:
      - calculations
  /api/cavi-calculations/draft/groups:
    delete:
      consumes:
      - application/json
      description: Удаляет группу пациентов из заявки-черновика
      parameters:
      - description: ID группы для удаления
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.mmDeleteReq'
      produces:
      - application/json
      responses:
        "200":
          description: ID заявки
          schema:
            additionalProperties:
              type: integer
            type: object
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удалить группу из черновика
      tags:
      - many-to-many
    put:
      consumes:
      - application/json
      description: Изменяет значение CAVI индекса для группы в заявке-черновике
      parameters:
      - description: ID группы и новый CAVI индекс
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.mmUpdateReq'
      produces:
      - application/json
      responses:
        "200":
          description: CAVI индекс обновлен
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "401":
          description: Требуется аутентификация
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Обновить CAVI индекс в черновике
      tags:
      - many-to-many
  /api/cavi-groups:
    get:
      description: Возвращает список групп пациентов с возможностью фильтрации
      parameters:
      - description: Поиск по названию
        in: query
        name: title
        type: string
      - description: Фильтр по возрастной группе
        in: query
        name: age_group
        type: string
      - description: Фильтр по типу заболевания
        in: query
        name: disease_type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Список групп
          schema:
            items:
              $ref: '#/definitions/ds.CaviGroup'
            type: array
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Получить список групп
      tags:
      - groups
    post:
      consumes:
      - application/json
      description: Создает новую группу пациентов (только для модераторов)
      parameters:
      - description: Данные новой группы
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.groupCreateReq'
      produces:
      - application/json
      responses:
        "201":
          description: Созданная группа
          schema:
            $ref: '#/definitions/ds.CaviGroup'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Требуется роль модератора
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Создать группу
      tags:
      - groups
  /api/cavi-groups/{id}:
    delete:
      description: Удаляет группу пациентов (soft-delete, только для модераторов)
      parameters:
      - description: ID группы
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Группа удалена
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Неверный ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "403":
          description: Требуется роль модератора
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удалить группу
      tags:
      - groups
    get:
      description: Возвращает детальную информацию о группе пациентов
      parameters:
      - description: ID группы
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Информация о группе
          schema:
            $ref: '#/definitions/ds.CaviGroup'
        "400":
          description: Неверный ID
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
        "404":
          description: Группа не найдена
          schema:
            $ref: '#/definitions/handler.ErrorResponse'
      summary: Получить группу по ID
      tags:
      - groups
    put:
      consumes:
      - application/json
      description: Обновляет данные группы пациентов (только для модераторов)
      parameters:
      - description: ID группы
        in: path
        name: id
        required: true
        type: integer
      - description: Данные для обновления
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.groupUpdateReq'
      produces:
      - application/json
